<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collins | Chaves</title><link rel="stylesheet" href="/admin.css"><script defer src="/admin.js"></script></head><body><main><header><h1>COLLINS <small>ADMIN</small></h1><p>Gerenciamento de chaves</p></header><section><h2>Acesso administrativo</h2><label>Token <input id="token" type="password" autocomplete="off" placeholder="Token do servidor"></label><button id="connect">Conectar</button><button id="logout" class="secondary">Sair</button><p id="status" role="status">Informe o token para acessar.</p></section><section><h2>Criar chave</h2><form id="create"><label>Nome <input id="label" maxlength="100" required placeholder="Cliente"></label><label>Dias <input id="days" type="number" min="1" max="3650" value="30" required></label><button>Criar chave</button></form><p>A chave aparece somente uma vez. Copie e guarde.</p><output id="newkey"></output></section><section><div class="row"><h2>Chaves</h2><button id="refresh" class="secondary">Atualizar</button></div><div class="tablewrap"><table><thead><tr><th>ID</th><th>Nome</th><th>Validade</th><th>Status</th><th>Ação</th></tr></thead><tbody id="rows"></tbody></table></div></section></main></body></html>
